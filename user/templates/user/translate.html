{% extends "cards.html" %}

<!-- translate text -->
{% block content %} 
<div class="container">
    <div class="row shadow p-3 mb-5 bg-white rounded">
        <div class="col-12 col-md-6">
            <h4>Test with your own text</h4>
            <form class="text-form">
                <div class="input-group input-group-sm mb-3">
                    <div class="input-group-prepend">
                        <label class="input-group-text" for="inputGroupSelect01">language</label>
                    </div>
                    <select class="custom-select" id="inputGroupSelect01">
                        <option selected>Choose...</option>
                        <option value="English">English</option>
                        <option value="IsiXhosa">IsiXhosa</option>
                        <option value="Sesotho">Sesotho</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <textarea style="min-height: 180px" class="form-control"></textarea>
                </div>  
                <button type="submit" class="btn btn-card shadow px-3 py-2 mb-2 rounded">Translate Text</button>  
            
            </form>
        </div>  
        
        <div class="col-12 col-md-6">
            <h4>Results</h4>
            <div class="input-group input-group-sm mb-2">
                <div class="input-group-prepend">
                    <label class="input-group-text" for="inputGroupSelect01">language</label>
                </div>
                <select class="custom-select" id="inputGroupSelect01">
                    <option selected>Choose...</option>
                    <option value="English">English</option>
                    <option value="IsiXhosa">IsiXhosa</option>
                    <option value="Sesotho">Sesotho</option>
                </select>
            </div>
            <textarea style="min-height: 240px" class="form-control mt-3 bg-light" readonly></textarea>
        
            <div class="spinner-border d-none" role="status">
                <span class="sr-only">Loading...</span>
            </div>       
        </div>       

    </div>      
</div>
{% endblock content %}
