<!-- add video -->
{% include "record/static.html" %}
{% block content %} 
<div class="container">
    <form class="text-form" id="video_form-for-{{word}}">
        <div style="height: 200px" class="form-group">
            <video id="myVideo" playsinline class="video-js vjs-default-skin"></video>
        </div>  
        <button type="submit" class="btn btn-primary btn-user btn-block">Add video</button>  
    </form>
</div>
{% endblock content %}

{% block script %}

<script>
    /* eslint-disable */
    var options = {
        controls: true,
        fluid: false,
        controlBar: {
            volumePanel: false
        },
        plugins: {
            record: {
                audio: false,
                video: true,
                maxLength: 10,
                debug: true
            }
        }
    };

    var formData = new FormData();
    formData.append('csrfmiddlewaretoken',"{{ csrf_token }}");

    // apply some workarounds for opera browser
    applyVideoWorkaround();

    var video_player = videojs('myVideo', options, function() {
        // print version information at startup
        var msg = 'Using video.js ' + videojs.VERSION +
            ' with videojs-record ' + videojs.getPluginVersion('record') +
            ' and recordrtc ' + RecordRTC.version;
        videojs.log(msg);
    });

    // error handling
    video_player.on('deviceError', function() {
        console.warn('device error:', video_player.deviceErrorCode);
    });

    video_player.on('error', function(element, error) {
        console.error(error);
    });

    // user clicked the record button and started recording
    video_player.on('startRecord', function() {
        console.log('started recording!');
    });

    // user completed recording and stream is available
    video_player.on('finishRecord', function() {
        // the blob object contains the recorded data that
        // can be downloaded by the user, stored on server etc.
        
        formData.append('video_player', video_player.recordedData);
        formData.append('name', video_player.recordedData.name);
        formData.append('size', video_player.recordedData.size);
        formData.append('type', video_player.recordedData.type);
        formData.append('created', video_player.recordedData.lastModifiedDate);

    });

$(document).ready(function() { 
    $('#video_form-for-{{word}}').submit(function(e) {
        formData.append('language', $('#inputGroupSelect_add_video_01').val());
        formData.append('text', $('#add_video_input').val());

        xhr("{% url 'video_container' %}", formData, function (fName) { 
            console.log("Video succesfully uploaded !");
        });

        function xhr(url, data, callback) {
            var request = new XMLHttpRequest();
            request.onreadystatechange = function () {
                if (request.readyState == 4 && request.status == 200) {
                    callback(location.href + request.responseText);
                }
            };
            request.open('POST', url);
            request.send(data);
        }

        e.preventDefault();
    });

});

</script>

{% endblock %}
