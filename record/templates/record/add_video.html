<!-- add video -->
{% include "record/static.html" %}
{% block content %} 
<div class="container">
    <div class="row shadow p-3 mb-5 bg-white rounded">
        <div class="col-12 col-md-6">
            <h4>Test with your own text</h4>
            <form class="text-form" id="video_form">
                <p class="my-0"> Copy-paste word here: </p>
                <input type="text" class="mb-3 form-control form-control-sm" name="add_video_input" id='add_video_input'>
                    
                <div class="input-group input-group-sm mb-3">
                    <div class="input-group-prepend">
                        <label class="input-group-text" for="inputGroupSelect_add_video_01">language</label>
                    </div>
                    <select name='language' class="custom-select" id="inputGroupSelect_add_video_01">
                        <option value="" selected>Choose...</option>
                        <option value="English">English</option>
                        <option value="IsiXhosa">IsiXhosa</option>
                        <option value="Sesotho">Sesotho</option>
                    </select>
                </div>
                
                <div style="height: 200px" class="form-group">
                    <video id="myVideo" playsinline class="video-js vjs-default-skin"></video>
                </div>  
                <button type="submit" class="btn btn-card shadow px-3 py-2 mb-2 rounded">Add video</button>  
            
            </form>
        </div>  
        
        <div class="col-12 col-md-6">
            <h4>Add metadata</h4>
            <form class="text-form">
                <div class="form-group">
                    <label class="my-0" for="">Copy-paste definition here:</label>                     
                    <textarea style="min-height: 100px" class="form-control"></textarea>
                </div>  

                <div class="form-group">
                    <label class="my-0" for="">Copy-paste example usage here:</label>                     
                    <textarea style="min-height: 100px" class="form-control"></textarea>
                </div> 

                <div class="input-group input-group-sm mb-3">
                    <div class="input-group-prepend">
                        <label class="input-group-text" for="inputGroupSelect_add_video_02">part of speech</label>
                    </div>
                    <select class="custom-select" id="inputGroupSelect_add_video_02">
                        <option selected>Choose...</option>
                        <option value="Adjective">Adjective</option>
                        <option value="Adverb">Adverb</option>
                        <option value="Conjunction">Conjunction</option>
                        <option value="Determiner">Determiner</option>
                        <option value="Noun">Noun</option>
                        <option value="Number">Number</option>
                        <option value="Preposition">Preposition</option>
                        <option value="Pronoun">Pronoun</option>
                        <option value="Verb">Verb</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-card shadow px-3 py-2 mb-2 rounded">Save</button>  
            
            </form>
        </div>   

    </div>       

</div>
{% endblock content %}

{% block script %}

<script>
    /* eslint-disable */
    var options = {
        controls: true,
        fluid: false,
        controlBar: {
            volumePanel: false
        },
        plugins: {
            record: {
                audio: false,
                video: true,
                maxLength: 10,
                debug: true
            }
        }
    };

    var formData = new FormData();
    formData.append('csrfmiddlewaretoken',"{{ csrf_token }}");

    // apply some workarounds for opera browser
    applyVideoWorkaround();

    var video_player = videojs('myVideo', options, function() {
        // print version information at startup
        var msg = 'Using video.js ' + videojs.VERSION +
            ' with videojs-record ' + videojs.getPluginVersion('record') +
            ' and recordrtc ' + RecordRTC.version;
        videojs.log(msg);
    });

    // error handling
    video_player.on('deviceError', function() {
        console.warn('device error:', video_player.deviceErrorCode);
    });

    video_player.on('error', function(element, error) {
        console.error(error);
    });

    // user clicked the record button and started recording
    video_player.on('startRecord', function() {
        console.log('started recording!');
    });

    // user completed recording and stream is available
    video_player.on('finishRecord', function() {
        // the blob object contains the recorded data that
        // can be downloaded by the user, stored on server etc.
        
        formData.append('video_player', video_player.recordedData);
        formData.append('name', video_player.recordedData.name);
        formData.append('size', video_player.recordedData.size);
        formData.append('type', video_player.recordedData.type);
        formData.append('created', video_player.recordedData.lastModifiedDate);

    });

$(document).ready(function() { 
    $('#video_form').submit(function(e) {
        formData.append('language', $('#inputGroupSelect_add_video_01').val());
        formData.append('text', $('#add_video_input').val());

        xhr("{% url 'video_container' %}", formData, function (fName) { 
            console.log("Video succesfully uploaded !");
        });

        function xhr(url, data, callback) {
            var request = new XMLHttpRequest();
            request.onreadystatechange = function () {
                if (request.readyState == 4 && request.status == 200) {
                    callback(location.href + request.responseText);
                }
            };
            request.open('POST', url);
            request.send(data);
        }

        e.preventDefault();
    });

});

</script>

{% endblock %}
